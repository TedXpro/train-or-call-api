[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "train-or-call-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]
notebooks = ["jupyterlab"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
